name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
          POSTGRES_DB: jobpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://jobpilot:jobpilot@localhost:5432/jobpilot_test' || '' }}
        shell: bash
        run: |
          set +e
          python -m pytest -q -rfE 2>&1 | tee pytest.out
          status=${PIPESTATUS[0]}
          # surface failures as annotations (readable without log access)
          grep -E "^(FAILED|ERROR) |^E   " pytest.out | head -40 | sed 's/^/::error title=pytest::/'
          exit $status
