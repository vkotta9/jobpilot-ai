name: Site timing

on:
  workflow_dispatch:

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install httpx
      - name: Time page loads
        working-directory: backend
        run: python -c "import sys; sys.argv=['x','timing','https://jobpilot-ai-45bq.onrender.com']; exec(open('scripts/live_check.py').read().replace('from app.services.sources import ADAPTERS, SourceError  # noqa: E402',''))"
