name: Site timing

on:
  workflow_dispatch:

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - name: Time page loads
        working-directory: backend
        run: python scripts/live_check.py timing https://jobpilot-ai-45bq.onrender.com
      - name: Interview prep resource links
        working-directory: backend
        run: python scripts/live_check.py links
        continue-on-error: true
