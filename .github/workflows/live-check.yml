name: Live integration check

# Verifies the real job sources (and the deployed site) from the internet.
# Runs when source adapters change, or manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/services/sources/**"
      - "backend/scripts/live_check.py"
      - ".github/workflows/live-check.yml"

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - name: Remotive (remote jobs, no key)
        working-directory: backend
        run: python scripts/live_check.py remotive
        continue-on-error: true
      - name: The Muse (no key)
        working-directory: backend
        run: python scripts/live_check.py muse
        continue-on-error: true
      - name: Greenhouse board (airbnb)
        working-directory: backend
        run: python scripts/live_check.py greenhouse airbnb
        continue-on-error: true
      - name: Lever board (palantir)
        working-directory: backend
        run: python scripts/live_check.py lever palantir
        continue-on-error: true
      - name: Himalayas (remote, no key)
        working-directory: backend
        run: python scripts/live_check.py himalayas
        continue-on-error: true
      - name: Jobicy (remote, no key)
        working-directory: backend
        run: python scripts/live_check.py jobicy
        continue-on-error: true
      - name: Arbeitnow (no key)
        working-directory: backend
        run: python scripts/live_check.py arbeitnow
        continue-on-error: true
      - name: Ashby board (openai)
        working-directory: backend
        run: python scripts/live_check.py ashby openai
        continue-on-error: true
      - name: Workable account (huggingface)
        working-directory: backend
        run: python scripts/live_check.py workable huggingface
        continue-on-error: true
      - name: Detect from links and names
        working-directory: backend
        run: python scripts/live_check.py detect "https://stripe.com/jobs|Databricks|https://jobs.ashbyhq.com/openai|Google"
        continue-on-error: true
      - name: Workday career sites
        working-directory: backend
        run: python scripts/live_check.py workday "nvidia|wd5|NVIDIAExternalCareerSite,salesforce|wd12|External_Career_Site,intel|wd1|External,adobe|wd5|external_experienced,hp|wd5|ExternalCareerSite,paypal|wd1|jobs,capitalone|wd12|Capital_One,mastercard|wd1|CorporateCareers,boeing|wd1|EXTERNAL_CAREERS,target|wd5|targetcareers,disney|wd5|disneycareer,workday|wd5|Workday,snapchat|wd1|snap,autodesk|wd1|Ext"
        continue-on-error: true
      - name: Workday sites in the top-tech list
        working-directory: backend
        run: python scripts/live_check.py workday "broadcom|wd1|External_Career,micron|wd1|External,kla|wd1|Search,analogdevices|wd1|External,marvell|wd1|MarvellCareers,cadence|wd1|External_Careers,motorolasolutions|wd5|Careers,redhat|wd5|Jobs,crowdstrike|wd5|crowdstrikecareers,etsy|wd5|Etsy_Careers,zillow|wd5|Zillow_Group_External,visa|wd5|Visa,generalmotors|wd5|Careers_GM"
        continue-on-error: true
      - name: Greenhouse board (xai)
        working-directory: backend
        run: python scripts/live_check.py greenhouse xai
        continue-on-error: true
      - name: Detect top-tech names
        working-directory: backend
        run: python scripts/live_check.py detect "xAI|Analog Devices|General Motors|Meta|eBay|Western Digital"
        continue-on-error: true
      - name: Detect Workday by name and link
        working-directory: backend
        run: python scripts/live_check.py detect "NVIDIA|https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite|Amazon"
        continue-on-error: true
      - name: Big-tech connectors
        working-directory: backend
        run: python scripts/live_check.py debug "greenhouse=spacex,workday=generalmotors|wd5|Careers_GM,google,microsoft,apple,amazon,eightfold=explore.jobs.netflix.net|netflix.com,oraclehcm=eeho.fa.us2.oraclecloud.com|CX_45001"
        continue-on-error: true
      - name: Robots rules for big-tech careers
        working-directory: backend
        run: python scripts/live_check.py robots "https://www.google.com/about/careers/applications/jobs/results?q=software,https://apply.careers.microsoft.com/api/apply/v2/jobs?domain=microsoft.com,https://apply.careers.microsoft.com/api/pcsx/search?domain=microsoft.com,https://www.metacareers.com/jobs,https://www.tesla.com/careers/search,https://jobs.apple.com/en-us/search,https://www.uber.com/us/en/careers/list/,https://jobs.careers.microsoft.com/global/en/search"
        continue-on-error: true
      - name: Deployed site health
        working-directory: backend
        run: python scripts/live_check.py site https://jobpilot-ai-45bq.onrender.com
        continue-on-error: true
      - name: Deployed site serves the top-tech list (expects 401 without login)
        working-directory: backend
        run: python scripts/live_check.py probe "https://jobpilot-ai-45bq.onrender.com/api/companies/top-tech,https://jobpilot-ai-45bq.onrender.com/js/pages/discover.js"
        continue-on-error: true
